# nginx site for Nirvona: static frontend + PHP-FPM API on ONE domain.
#
# Same origin for both (https://nirvona.example.com and /api/...) means no CORS
# preflights (fewer requests), the API can be locked to the site, and the CSP
# below can say connect-src 'self'. Build the frontend with
#   VITE_API_BASE_URL=/api npm run build
# and copy dist/ to /var/www/nirvona/dist. See DEPLOYMENT.md.

# ---- outer flood protection (the API also rate-limits per user/account) ----
limit_req_zone $binary_remote_addr zone=api_flood:20m rate=60r/s;

# ---- cache for the PUBLIC catalogue only (identical for every visitor) ----
# 1000 visitors opening the landing page in the same second cost PHP ~1 request:
# the first fills the cache, `fastcgi_cache_lock` makes the rest wait for it.
fastcgi_cache_path /var/cache/nginx/nirvona levels=1:2 keys_zone=nirvona_public:10m max_size=100m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name nirvona.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nirvona.example.com;

    ssl_certificate     /etc/letsencrypt/live/nirvona.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nirvona.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;

    root /var/www/nirvona/dist;
    index index.html;
    client_max_body_size 2m;            # matches the API's own cap

    # ---- compression (text assets only) ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    # If the brotli module is installed, also: brotli on; brotli_comp_level 6; brotli_types <same list>;

    # ---- security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- hashed build files: cache for a year, never revalidate ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # add_header lines in a location REPLACE the server-level ones, so repeat them:
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;   # a new deploy is seen immediately
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # ---- single-page app: any non-file path is a client-side route ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API: public catalogue (cached 10 s, matches the API's own Cache-Control) ----
    location ~ ^/api/(courses|packages|subjects)(/|$) {
        limit_req zone=api_flood burst=200 nodelay;

        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/nirvona/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;

        fastcgi_cache nirvona_public;
        fastcgi_cache_key "$request_method$host$request_uri";
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_valid 200 10s;
        fastcgi_cache_lock on;                     # one request refreshes, the rest wait
        fastcgi_cache_use_stale updating error timeout http_500 http_503;
        fastcgi_cache_background_update on;
        # Never cache anything carrying credentials.
        fastcgi_no_cache $http_authorization;
        fastcgi_cache_bypass $http_authorization;
        fastcgi_ignore_headers Cache-Control Expires;   # we decide (10 s above)
        add_header X-Cache $upstream_cache_status;
    }

    # ---- API: everything else (per-user data, login, payments, admin) - never cached ----
    location /api/ {
        limit_req zone=api_flood burst=200 nodelay;

        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/nirvona/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 30s;
        # PhonePe's server-to-server webhook and normal clients both arrive here.
    }

    # ---- never serve source, env files, logs, VCS data ----
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(php|env|log|sql|md)$ { deny all; }
}
