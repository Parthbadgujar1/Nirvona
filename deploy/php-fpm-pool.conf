; PHP-FPM pool for the Nirvona API.  Copy to /etc/php/8.2/fpm/pool.d/nirvona.conf
;
; SIZING: pm.max_children = (RAM you can give PHP) / (memory per worker).
; A Nirvona worker uses roughly 30-40 MB. Measured throughput per worker is
; ~150-450 req/s of pure app time (see DEPLOYMENT.md), so 16-32 workers are
; plenty for 1,000 concurrent students; the limit you will actually hit first
; is Postgres connections (see the pgbouncer note in DEPLOYMENT.md).

[nirvona]
user = www-data
group = www-data
listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.backlog = 1024

pm = dynamic
pm.max_children = 32
pm.start_servers = 12
pm.min_spare_servers = 8
pm.max_spare_servers = 16
; Recycle a worker after N requests: bounds any slow memory growth.
pm.max_requests = 1000

; A request that runs longer than this is killed (a stuck DB/gateway call must
; not hold a worker hostage while everyone else queues).
request_terminate_timeout = 30s

; Pass the real environment (DB_*, JWT_SECRET, PHONEPE_*, ...) to PHP. Set them
; here or in the systemd unit instead of shipping a .env file, if you prefer.
clear_env = no
catch_workers_output = yes

; Persistent DB/Redis connections (see app/Config/Database.php + Cache.php) live
; as long as the worker does, so each worker keeps ONE Postgres connection:
; max_children is therefore also roughly your Postgres connection count.
php_admin_value[error_log] = /var/log/php8.2-fpm-nirvona.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
