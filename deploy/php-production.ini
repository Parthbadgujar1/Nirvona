; Production PHP settings. Copy to /etc/php/8.2/fpm/conf.d/99-nirvona.ini
;
; The single biggest PHP speed-up is opcache: without it PHP re-reads and
; re-compiles every source file on every request.

expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 128M
max_execution_time = 30
; Only the request body cap the API itself enforces (2 MB) is needed.
post_max_size = 3M
upload_max_filesize = 2M

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; 0 = never re-check files: fastest. REQUIRES a php-fpm reload after each deploy
;   (sudo systemctl reload php8.2-fpm), which the deploy steps in DEPLOYMENT.md do.
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Cache file-path lookups (autoloading resolves thousands of paths).
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Postgres/Redis extensions must be enabled: pdo_pgsql, redis is NOT needed (Predis is pure PHP).
