<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1d4a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/nirvona-logo.svg" />

    <title>Nirvona Education Tech — Prepare. Test. Analyze. Improve.</title>
    <meta
      name="description"
      content="India's next-generation examination and performance platform for ambitious students. Computer-based tests, all-India ranking and detailed performance analytics."
    />
    <meta
      name="keywords"
      content="CBT exam, JEE mock test, NEET mock test, Class 11, Class 12, online examination platform, Nirvona Education Tech"
    />
    <meta property="og:title" content="Nirvona Education Tech" />
    <meta
      property="og:description"
      content="India's next-generation examination and performance platform for ambitious students."
    />
    <meta property="og:type" content="website" />

    <!-- Fonts are self-hosted (@fontsource-variable, imported in src/main.tsx):
         no third-party request chain blocking first paint. -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
    <style>
      /* Shown instantly, before any JavaScript arrives; React replaces it. */
      .boot{display:flex;min-height:100dvh;align-items:center;justify-content:center;background:#fff}
      .boot span{width:34px;height:34px;border-radius:50%;border:3px solid #e3e6ef;border-top-color:#0e1d4a;animation:boot-spin .8s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.boot span{animation-duration:2.4s}}
    </style>
  </head>
  <body class="min-h-dvh antialiased">
    <div id="root"><div class="boot" role="status" aria-label="Loading"><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
